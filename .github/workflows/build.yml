name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      # Signatures of the game classes the client uses, published with the screenshots
      # so method names can be checked without a local copy of the game.
      - name: Dump game API signatures
        if: ${{ always() }}
        continue-on-error: true
        run: |
          mkdir -p build/api
          find ~/.gradle/caches/fabric-loom .gradle/loom-cache ~/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api \
            -name '*.jar' 2>/dev/null | grep -v -- '-sources' > build/api/jars.txt || true
          cp=$(tr '\n' ':' < build/api/jars.txt)
          while read -r cls; do
            [ -z "$cls" ] && continue
            javap -cp "$cp" -p "$cls" > "build/api/$cls.txt" 2>&1 || true
          done < .github/api-classes.txt

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: lumen-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # The game test starts Minecraft with Lumen, builds a scene, exercises the
      # modules and GUI, and saves screenshots. Mesa provides a software renderer.
      - name: Install Mesa drivers
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers

      - name: Run client game test
        timeout-minutes: 15
        run: ./gradlew runClientGameTest --stacktrace

      - name: Upload screenshots and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: game-test-output
          path: |
            build/run/*/screenshots
            build/run/*/logs/latest.log
            build/run/*/crash-reports
          compression-level: 0

      # Also publish them, with the mod jar, to the ci-screenshots branch so they
      # can be fetched without downloading an artifact.
      - name: Publish screenshots branch
        if: ${{ always() && github.event_name == 'push' }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(mktemp -d)
          for dir in build/run/*/; do
            cp -r "$dir"screenshots/. "$out"/ 2>/dev/null || true
            cp "$dir"logs/latest.log "$out"/latest.log 2>/dev/null || true
            cp -r "$dir"crash-reports "$out"/ 2>/dev/null || true
          done
          # The mod jar too, so it can be fetched with git as well as from the artifact.
          for jar in build/libs/*.jar; do
            [ -e "$jar" ] || continue
            case "$jar" in *-sources.jar) ;; *) cp "$jar" "$out"/ ;; esac
          done
          cp -r build/api "$out"/api 2>/dev/null || true
          echo "Screenshots and mod jar for ${GITHUB_SHA}" > "$out"/README.md
          cd "$out"
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Game test output for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
