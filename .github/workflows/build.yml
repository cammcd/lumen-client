name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: lumen-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # The game test starts Minecraft with Lumen, builds a scene, exercises the
      # modules and GUI, and saves screenshots. Mesa provides a software renderer.
      - name: Install Mesa drivers
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers

      - name: Run client game test
        timeout-minutes: 15
        run: ./gradlew runClientGameTest --stacktrace

      - name: Upload screenshots and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: game-test-output
          path: |
            build/run/*/screenshots
            build/run/*/logs/latest.log
            build/run/*/crash-reports
          compression-level: 0

      # Also publish them to the ci-screenshots branch so they can be viewed
      # without downloading an artifact.
      - name: Publish screenshots branch
        if: ${{ always() && github.event_name == 'push' }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(mktemp -d)
          for dir in build/run/*/; do
            cp -r "$dir"screenshots/. "$out"/ 2>/dev/null || true
            cp "$dir"logs/latest.log "$out"/latest.log 2>/dev/null || true
            cp -r "$dir"crash-reports "$out"/ 2>/dev/null || true
          done
          echo "Screenshots for ${GITHUB_SHA}" > "$out"/README.md
          cd "$out"
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Game test output for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
